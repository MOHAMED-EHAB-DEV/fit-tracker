name: Build & Release Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "FitTrackerAndroid/**"
      - "version.json"
      - "RELEASE_NOTES.md"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Changelog / Release Notes (Markdown supported)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      # Step 1: Extract Version Metadata from version.json BEFORE building APK
      - name: Extract Version Metadata & Prepare Notes
        id: prep
        run: |
          mkdir -p release-output

          # Extract version from version.json
          VERSION_NAME=$(node -p "require('./version.json').versionName || '1.0.0'")
          VERSION_CODE=$(node -p "require('./version.json').versionCode || ${{ github.run_number }}")

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "=========================================="
          echo "Building FitTracker APK v$VERSION_NAME (Build $VERSION_CODE)"
          echo "=========================================="

          # Determine Release Notes
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            cat << 'EOF' > release-output/notes.txt
          ${{ github.event.inputs.release_notes }}
          EOF
          elif [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md release-output/notes.txt
          elif [ -f FitTrackerAndroid/RELEASE_NOTES.md ]; then
            cp FitTrackerAndroid/RELEASE_NOTES.md release-output/notes.txt
          else
            cat << 'EOF' > release-output/notes.txt
          ### 🚀 What's New
          - Automated build updates and optimizations.
          - Performance improvements.
          EOF
          fi

          # Generate release version metadata JSON
          node -e '
            const fs = require("fs");
            const vData = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const notes = fs.readFileSync("release-output/notes.txt", "utf8");
            const data = {
              versionCode: vData.versionCode || ${{ github.run_number }},
              versionName: vData.versionName || "1.0.0",
              commit: "${{ github.sha }}",
              timestamp: new Date().toISOString(),
              releaseNotes: notes
            };
            fs.writeFileSync("release-output/version.json", JSON.stringify(data, null, 2));
          '

      # Step 2: Build APK with explicit version parameters injected into Gradle
      - name: Build APK with Gradle
        working-directory: FitTrackerAndroid
        run: gradle assembleDebug -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ env.VERSION_NAME }} --stacktrace

      # Step 3: Copy and archive APK assets
      - name: Package Release APKs
        run: |
          cp FitTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk release-output/FitTracker.apk
          cp FitTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk "release-output/FitTracker-v${{ env.VERSION_NAME }}.apk"

      - name: Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: FitTracker-APK
          path: release-output/FitTracker.apk
          retention-days: 14

      # Step 4: Publish Versioned Release (GitHub automatically marks the newest as 'Latest')
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "FitTracker Android App v${{ env.VERSION_NAME }}"
          body_path: release-output/notes.txt
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-output/FitTracker.apk
            release-output/FitTracker-v${{ env.VERSION_NAME }}.apk
            release-output/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
