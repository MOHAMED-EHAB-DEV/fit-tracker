name: Build & Release Android APK

# Builds the RELEASE variant, signed with the private release key held in
# repository secrets, and publishes it as GitHub release "v<versionName>".
# The job fails (and publishes nothing) when:
#   - a signing secret is missing,
#   - the APK is signed with the public debug key,
#   - the tag v<versionName> already exists (bump version.json first),
#   - versionCode is not higher than the latest published release's.
# See FitTrackerAndroid/RELEASE_SIGNING.md.

on:
  push:
    branches: [main, master]
    paths:
      - "FitTrackerAndroid/**"
      - "version.json"
      - "RELEASE_NOTES.md"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Changelog / Release Notes (Markdown supported)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # SHA-256 of the public debug certificate (FitTrackerAndroid/keystore/debug.keystore).
  # A release signed with it is refused.
  DEBUG_CERT_SHA256: c2cf20ac756566fc6a9df895c34c6127814a705c7fbe54f5b66972f4b8144ec1

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read and validate version
        id: version
        run: |
          node -e '
            const v = JSON.parse(require("fs").readFileSync("version.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(String(v.versionName))) { console.error("version.json: versionName must be X.Y.Z"); process.exit(1); }
            if (!Number.isInteger(v.versionCode) || v.versionCode < 1) { console.error("version.json: versionCode must be a positive integer"); process.exit(1); }
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            out.write(`name=${v.versionName}\ncode=${v.versionCode}\ntag=v${v.versionName}\n`);
          '

      - name: Refuse to republish or go backwards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Run 'node scripts/bump-version.mjs patch' and commit version.json to publish a new build."
            exit 1
          fi
          mkdir -p previous-release
          if gh release download --pattern version.json --dir previous-release >/dev/null 2>&1; then
            PREVIOUS_CODE=$(node -p 'JSON.parse(require("fs").readFileSync("previous-release/version.json","utf8")).versionCode || 0')
            if [ "$VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
              echo "::error::versionCode $VERSION_CODE is not higher than the latest release's $PREVIOUS_CODE."
              exit 1
            fi
          fi

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secrets:$missing. Nothing was published. See FitTrackerAndroid/RELEASE_SIGNING.md."
            exit 1
          fi

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: FitTrackerAndroid
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --stacktrace

      # Optional: proof-of-rotation from the old (debug) key, so installs signed with
      # the old key accept this update. Only runs when the lineage secret exists.
      - name: Re-sign with key rotation lineage
        env:
          ANDROID_SIGNING_LINEAGE_BASE64: ${{ secrets.ANDROID_SIGNING_LINEAGE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_SIGNING_LINEAGE_BASE64" ]; then
            echo "No lineage secret: keeping the APK signed with the release key only."
            exit 0
          fi
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          echo "$ANDROID_SIGNING_LINEAGE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.lineage"
          APK=FitTrackerAndroid/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" sign \
            --ks FitTrackerAndroid/keystore/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --next-signer \
            --ks "$ANDROID_KEYSTORE_PATH" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            --lineage "$RUNNER_TEMP/signing.lineage" \
            --out "$RUNNER_TEMP/app-release-rotated.apk" "$APK"
          mv "$RUNNER_TEMP/app-release-rotated.apk" "$APK"

      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          APK=FitTrackerAndroid/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed release APK not found (was the build unsigned?)"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          cat "$RUNNER_TEMP/certs.txt"
          # With a rotation lineage the old debug signer may also be listed; a non-debug signer must exist.
          SIGNER=$(grep "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' | grep -v -x "$DEBUG_CERT_SHA256" | head -1)
          if [ -z "$SIGNER" ]; then
            echo "::error::The release APK is signed with the public debug key. Nothing was published."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/signing.lineage"

      - name: Prepare release files
        env:
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p release-output
          APK=FitTrackerAndroid/app/build/outputs/apk/release/app-release.apk
          cp "$APK" release-output/FitTracker.apk
          cp "$APK" "release-output/FitTracker-v$VERSION_NAME.apk"

          if [ -n "$RELEASE_NOTES_INPUT" ]; then
            printf '%s\n' "$RELEASE_NOTES_INPUT" > release-output/notes.txt
          elif [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md release-output/notes.txt
          else
            printf '%s\n' "### What's New" "- Bug fixes and improvements." > release-output/notes.txt
          fi

          APK_SHA256=$(sha256sum release-output/FitTracker.apk | awk '{print $1}')
          export APK_SHA256
          node -e '
            const fs = require("fs");
            const data = {
              versionCode: Number(process.env.VERSION_CODE),
              versionName: process.env.VERSION_NAME,
              packageName: "com.fittracker",
              apkSha256: process.env.APK_SHA256,
              commit: process.env.GITHUB_SHA,
              timestamp: new Date().toISOString(),
              releaseNotes: fs.readFileSync("release-output/notes.txt", "utf8"),
            };
            fs.writeFileSync("release-output/version.json", JSON.stringify(data, null, 2));
          '

      - name: Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: FitTracker-APK
          path: release-output/FitTracker.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FitTracker Android App ${{ steps.version.outputs.tag }}
          body_path: release-output/notes.txt
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-output/FitTracker.apk
            release-output/FitTracker-v${{ steps.version.outputs.name }}.apk
            release-output/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
