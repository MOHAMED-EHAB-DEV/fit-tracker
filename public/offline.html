<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F4F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0D0F" />
    <meta name="color-scheme" content="light dark" />
    <title>You are offline - FitTracker</title>
    <style>
      :root {
        --canvas: #f5f4f0;
        --ink: #171715;
        --ink-2: #57564f;
        --inverse: #ffffff;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0c0d0f;
          --ink: #f2f4f7;
          --ink-2: #9ca3af;
          --inverse: #0c0d0f;
          --accent: #4c82fb;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--canvas);
        color: var(--ink);
        font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 15px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.4;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 28rem;
        font-size: 14px;
        line-height: 1.45;
        color: var(--ink-2);
      }
      button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: var(--inverse);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 1.5px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>
        FitTracker needs a connection to open this page. A workout you were logging is saved on this device and is
        sent as soon as you are back online.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.reload();
      });
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
